function sHistory(t) { // 62–72

  const ev = [['1905', 'Léon Creux', 'Brevet France + USA', 'Patent in France and the US'], ['1945+', 'Machines-outils', 'Précision enfin suffisante', 'Precision finally good enough'], ['1975', 'Niels Young', 'Étanchéité radiale', 'Radial compliance'], ['1981', 'Sanden', '1er scroll automobile', 'First automotive scroll'], ['1983', 'Hitachi', '1er climatiseur scroll', 'First scroll room A/C']];
  const x0 = 110, x1 = 1170, y = 330; const la = eout(seg(t, 62.4, 64)); ctx.save(); ctx.strokeStyle = '#3a4a5a'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(x0, y); ctx.lineTo(x0 + (x1 - x0) * la, y); ctx.stroke(); ctx.restore();

    adv.forEach((d, i) => { const a = eout(seg(t, 72.5 + i * .6, 73.2 + i * .6)) * (1 - seg(t, 76.5, 77)); const x = 90 + i * 380, y = 250 - (1 - a) * 30; ctx.save(); ctx.globalAlpha = a; rrect(x, y, 340, 190, 16); ctx.fillStyle = C.panel; ctx.fill(); ctx.strokeStyle = d[2]; ctx.lineWidth = 2; ctx.stroke(); ctx.fillStyle = d[2]; rrect(x + 28, y + 30, 46, 8, 4); ctx.fill(); ctx.restore();

  // fondu entre scènes
  let f = 0; SCENES.forEach(s => { if (s[0] > 0) f = Math.max(f, 1 - Math.abs(t - s[0]) / 0.3); }); f = Math.max(f, 1 - t / 0.5, seg(t, DUR - 0.8, DUR));
  if (f > 0) { ctx.fillStyle = `rgba(0,0,0,${clamp(f)})`; ctx.fillRect(0, 0, W, H); }
}

/* ---- musique générée ---- */
async function music() {
  const SR = 48000, oc = new OfflineAudioContext(2, SR * DUR, SR), master = oc.createGain(); master.connect(oc.destination);
  master.gain.setValueAtTime(0, 0); master.gain.linearRampToValueAtTime(0.9, 2.5); master.gain.setValueAtTime(0.9, DUR - 3); master.gain.linearRampToValueAtTime(0, DUR - 0.2);
  const lpf = oc.createBiquadFilter(); lpf.type = 'lowpass'; lpf.frequency.value = 1100; lpf.Q.value = 0.6; lpf.connect(master);
  const hz = m => 440 * 2 ** ((m - 69) / 12);
  const prog = [[57, 60, 64], [53, 57, 60], [48, 52, 55, 60], [55, 59, 62]]; // Am F C G
  for (let b = 0, t0 = 0; t0 < DUR; b++, t0 += 5) { const ch = prog[b % 4];
    ch.forEach(n => [-6, 6].forEach(det => { const o = oc.createOscillator(); o.type = 'sawtooth'; o.frequency.value = hz(n); o.detune.value = det; const g = oc.createGain(); g.gain.setValueAtTime(0, t0); g.gain.linearRampToValueAtTime(0.018, t0 + 1.4); g.gain.setValueAtTime(0.018, t0 + 4.2); g.gain.linearRampToValueAtTime(0, t0 + 5.6); o.connect(g); g.connect(lpf); o.start(t0); o.stop(t0 + 5.7); }));
    const bo = oc.createOscillator(); bo.type = 'sine'; bo.frequency.value = hz(ch[0] - 12); const bg = oc.createGain(); bg.gain.setValueAtTime(0, t0); bg.gain.linearRampToValueAtTime(0.11, t0 + 0.6); bg.gain.setValueAtTime(0.11, t0 + 4.4); bg.gain.linearRampToValueAtTime(0, t0 + 5.3); bo.connect(bg); bg.connect(master); bo.start(t0); bo.stop(t0 + 5.4); }
  const noise = oc.createBuffer(1, SR * 2, SR); { const d = noise.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; }
  const hat = oc.createBiquadFilter(); hat.type = 'highpass'; hat.frequency.value = 7000; hat.connect(master);
  for (let t = 7; t < DUR - 4; t += 0.5) { const s = oc.createBufferSource(); s.buffer = noise; const g = oc.createGain(); const v = (Math.round(t * 2) % 2) ? 0.012 : 0.022; g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.09); s.connect(g); g.connect(hat); s.start(t, Math.random(), 0.1); }
  for (let t = 7; t < DUR - 4; t += 1) { const o = oc.createOscillator(); o.frequency.setValueAtTime(110, t); o.frequency.exponentialRampToValueAtTime(42, t + 0.18); const g = oc.createGain(); g.gain.setValueAtTime(0.16, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.25); o.connect(g); g.connect(master); o.start(t); o.stop(t + 0.3); }
  { const s = oc.createBufferSource(); s.buffer = noise; s.loop = true; const f = oc.createBiquadFilter(); f.type = 'bandpass'; f.Q.value = 3; f.frequency.setValueAtTime(300, 19); f.frequency.exponentialRampToValueAtTime(3500, 23.5); const g = oc.createGain(); g.gain.setValueAtTime(0, 19); g.gain.linearRampToValueAtTime(0.12, 22); g.gain.linearRampToValueAtTime(0, 24.2); s.connect(f); f.connect(g); g.connect(master); s.start(19); s.stop(24.5); }
  { const o = oc.createOscillator(); o.frequency.setValueAtTime(160, 57); o.frequency.exponentialRampToValueAtTime(50, 57.15); const g = oc.createGain(); g.gain.setValueAtTime(0.5, 57); g.gain.exponentialRampToValueAtTime(0.0001, 57.4); o.connect(g); g.connect(master); o.start(57); o.stop(57.5); }
  return oc.startRendering();
}

/* ---- encodage ---- */
async function run() {
  await document.fonts.load(`700 100px ${DISP}`); await document.fonts.load(`600 20px ${BODY}`); await document.fonts.load(`italic 400 20px ${BODY}`); await document.fonts.load(`600 16px ${MONO}`); await document.fonts.ready;
  let vcodec = null; for (const c of ['avc1.640028', 'avc1.4d0028', 'avc1.42002a']) { const r = await VideoEncoder.isConfigSupported({ codec: c, width: W, height: H, bitrate: 1.15e6, framerate: FPS }); if (r.supported) { vcodec = c; break; } }
  if (!vcodec) { log('H.264 indisponible'); return; }
  let acfg = { codec: 'mp4a.40.2', sampleRate: 48000, numberOfChannels: 2, bitrate: 96000 }; let audio = false;
  try { audio = (await AudioEncoder.isConfigSupported(acfg)).supported; } catch (e) { audio = false; }
  log('codec ' + vcodec + ' audio ' + audio);
  const muxer = new Mp4Muxer.Muxer({ target: new Mp4Muxer.ArrayBufferTarget(), video: { codec: 'avc', width: W, height: H, frameRate: FPS }, audio: audio ? { codec: 'aac', numberOfChannels: 2, sampleRate: 48000 } : undefined, fastStart: 'in-memory' });
  const venc = new VideoEncoder({ output: (c, m) => muxer.addVideoChunk(c, m), error: e => log('ERR ' + e.message) });
  venc.configure({ codec: vcodec, width: W, height: H, bitrate: 1.15e6, bitrateMode: 'variable', latencyMode: 'quality', framerate: FPS, avc: { format: 'avc' } });
  const N = Math.round(DUR * FPS), t0 = performance.now();
  for (let i = 0; i < N; i++) {
    renderAt(i / FPS);
    const fr = new VideoFrame(out, { timestamp: Math.round(i * 1e6 / FPS), duration: Math.round(1e6 / FPS) }); venc.encode(fr, { keyFrame: i % 60 === 0 }); fr.close();
    while (venc.encodeQueueSize > 6) await new Promise(r => venc.addEventListener('dequeue', r, { once: true }));
    if (i % 90 === 0) { log(`image ${i}/${N} · ${((performance.now() - t0) / 1000).toFixed(0)} s`); await new Promise(r => { const c = new MessageChannel(); c.port1.onmessage = () => r(); c.port2.postMessage(0); }); }
  }
  await venc.flush();
  if (audio) {
    log('audio…'); const buf = await music();
    const aenc = new AudioEncoder({ output: (c, m) => muxer.addAudioChunk(c, m), error: e => log('AERR ' + e.message) }); aenc.configure(acfg);
    const L = buf.getChannelData(0), R = buf.getChannelData(1), F = 4800;
    for (let s = 0; s < L.length; s += F) { const n = Math.min(F, L.length - s); const d = new Float32Array(n * 2); d.set(L.subarray(s, s + n), 0); d.set(R.subarray(s, s + n), n);
      const ad = new AudioData({ format: 'f32-planar', sampleRate: 48000, numberOfFrames: n, numberOfChannels: 2, timestamp: Math.round(s / 48000 * 1e6), data: d }); aenc.encode(ad); ad.close(); }
    await aenc.flush();
  }
  muxer.finalize(); const blob = new Blob([muxer.target.buffer], { type: 'video/mp4' });
  log('envoi ' + (blob.size / 1e6).toFixed(1) + ' Mo');
  const r = await fetch('/save/scroll-compressor.mp4', { method: 'POST', body: blob }); log('TERMINÉ ' + (await r.text()));
  window.DONE = true;
}
window.renderAt = renderAt; window.run = run;
document.fonts.ready.then(() => { renderAt(0.01); log('prêt'); });
</script></body></html>
